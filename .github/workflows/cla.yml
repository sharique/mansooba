name: CLA

# Blocks a code contribution from anyone other than the owner until they
# have signed CLA.md.
#
# pull_request_target runs with the BASE repository's permissions, which is
# why this workflow must never check out the pull request's own code — it
# only reads PR metadata and comments, both from trusted, already-merged
# workflow content.

on:
  pull_request_target:
    types: [opened, synchronize, closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  statuses: write
  actions: write

jobs:
  cla:
    runs-on: ubuntu-26.04
    steps:
      - name: "CLA Assistant"
        if: >
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        # step-security/contributor-assistant-github-action v2.6.1, a
        # maintained fork of the archived contributor-assistant/github-action.
        # Pinned by full commit SHA, not a moving tag, because of
        # the elevated pull_request_target privilege this workflow needs.
        uses: step-security/contributor-assistant-github-action@b9bd60bf1b766fa48dae03427059187137236239
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: "https://github.com/sharique/mansooba/blob/main/CLA.md"
          path-to-signatures: "signatures/v1/cla.json"
          branch: "cla-signatures"
          allowlist: "sharique,bot*"
          lock-pullrequest-aftermerge: false
