name: CI

on:
  push:
    branches: ["main", "develop", "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # Fails if LICENSE/NOTICE/README/manifests disagree, or any of them still
  # says the project is unlicensed or undecided (the licence must be stated
  # consistently everywhere). Read-only, no network. A job of its own so it
  # shows as its own check on a pull request.
  licence-statements:
    name: Verify licence statements
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-license-statements.sh

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        go: ["1.27.x"]

    # S3-backed storage tests (attachments, avatars) run against real
    # LocalStack — no mocks (Constitution Principle III).
    services:
      localstack:
        image: localstack/localstack:4.14.0
        env:
          SERVICES: s3
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      # Fails fast on floating image tags / runner labels and on version drift
      # between places that must agree (ADR-034). Read-only, no network.
      - name: Verify pinned versions
        run: scripts/verify-versions.sh

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download modules
        working-directory: backend
        run: go mod download

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Create S3 bucket in LocalStack
        run: aws --endpoint-url http://localhost:4566 s3 mb s3://mansooba-attachments --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      - name: Test
        working-directory: backend
        run: go test -race -count=1 ./...
        env:
          # A missing LocalStack must fail the build, not silently skip the S3 tests.
          REQUIRE_LOCALSTACK: "1"

  frontend:
    name: Frontend
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      # The Node major is declared once, in frontend/.nvmrc (checked against the
      # Dockerfile by scripts/verify-versions.sh).
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test

  licences:
    name: Licences
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Fixtures first (no network): the checker's own logic, not yet the
      # real tools' classification.
      - name: Verify licence-check fixtures
        run: scripts/check-licenses_test.sh

      # Fails on any GPL-only, AGPL-only, source-available or unlicensed
      # dependency in the backend binary, the frontend production tree, or
      # a used icon set.
      - name: Check third-party licences
        run: scripts/check-licenses.sh

  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-26.04
    needs: [test, frontend, licences]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Generated fresh for every image build —
      # not committed, hence the Go/Node setup above just for this step.
      - name: Generate third-party notices
        run: |
          scripts/generate-notices.sh > THIRD-PARTY-NOTICES.md
          cp LICENSE NOTICE THIRD-PARTY-NOTICES.md backend/legal/
          cp LICENSE NOTICE THIRD-PARTY-NOTICES.md frontend/legal/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sharique/mansooba-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta-backend.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sharique/mansooba-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
