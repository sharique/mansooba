name: CI

on:
  push:
    branches: ["main", "develop", "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        go: ["1.27.x"]

    # S3-backed storage tests (attachments, avatars) run against real
    # LocalStack — no mocks (Constitution Principle III).
    services:
      localstack:
        image: localstack/localstack:4.14.0
        env:
          SERVICES: s3
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      # Fails fast on floating image tags / runner labels and on version drift
      # between places that must agree (ADR-034). Read-only, no network.
      - name: Verify pinned versions
        run: scripts/verify-versions.sh

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download modules
        working-directory: backend
        run: go mod download

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Create S3 bucket in LocalStack
        run: aws --endpoint-url http://localhost:4566 s3 mb s3://mansooba-attachments --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      - name: Test
        working-directory: backend
        run: go test -race -count=1 ./...
        env:
          # A missing LocalStack must fail the build, not silently skip the S3 tests.
          REQUIRE_LOCALSTACK: "1"

  frontend:
    name: Frontend
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      # The Node major is declared once, in frontend/.nvmrc (checked against the
      # Dockerfile by scripts/verify-versions.sh).
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test

  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-26.04
    needs: [test, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sharique/mansooba-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sharique/mansooba-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
