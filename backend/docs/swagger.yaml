basePath: /api/v1
definitions:
  apierror.APIError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  dto.AboutResponse:
    properties:
      license:
        type: string
      license_url:
        type: string
      source_url:
        type: string
      version:
        type: string
    type: object
  dto.ActivityEventResponse:
    properties:
      actor_avatar_url:
        type: string
      actor_id:
        type: integer
      actor_name:
        type: string
      created_at:
        type: string
      id:
        type: integer
      issue_id:
        type: integer
      issue_key:
        type: string
      issue_title:
        type: string
      kind:
        type: string
      new_value:
        type: string
      old_value:
        type: string
    type: object
  dto.AddMemberRequest:
    properties:
      email:
        type: string
      role:
        enum:
        - admin
        - member
        - viewer
        type: string
    required:
    - email
    - role
    type: object
  dto.AdminUserDTO:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_admin:
        type: boolean
      name:
        type: string
    type: object
  dto.AdminUserListResponse:
    properties:
      page:
        type: integer
      size:
        type: integer
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/dto.AdminUserDTO'
        type: array
    type: object
  dto.AdminUserPatchRequest:
    properties:
      is_active:
        type: boolean
      is_admin:
        type: boolean
    type: object
  dto.AttachmentDownloadResponse:
    properties:
      filename:
        type: string
      url:
        type: string
    type: object
  dto.AttachmentListResponse:
    properties:
      attachments:
        items:
          $ref: '#/definitions/dto.AttachmentResponse'
        type: array
    type: object
  dto.AttachmentRejection:
    properties:
      filename:
        type: string
      reason:
        type: string
    type: object
  dto.AttachmentResponse:
    properties:
      content_type:
        type: string
      created_at:
        type: string
      filename:
        type: string
      id:
        type: integer
      issue_id:
        type: integer
      size_bytes:
        type: integer
      uploader_id:
        type: integer
      uploader_name:
        type: string
    type: object
  dto.AttachmentUploadResult:
    properties:
      rejected:
        items:
          $ref: '#/definitions/dto.AttachmentRejection'
        type: array
      uploaded:
        items:
          $ref: '#/definitions/dto.AttachmentResponse'
        type: array
    type: object
  dto.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/dto.UserDTO'
    type: object
  dto.BoardColumn:
    properties:
      issues:
        items:
          $ref: '#/definitions/dto.IssueResponse'
        type: array
      status:
        type: string
    type: object
  dto.BoardResponse:
    properties:
      columns:
        items:
          $ref: '#/definitions/dto.BoardColumn'
        type: array
    type: object
  dto.BurndownPoint:
    properties:
      date:
        type: string
      remaining_points:
        type: integer
    type: object
  dto.BurndownResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.BurndownPoint'
        type: array
      end_date:
        type: string
      sprint_id:
        type: integer
      sprint_name:
        type: string
      start_date:
        type: string
      total_points:
        type: integer
    type: object
  dto.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    required:
    - current_password
    - new_password
    type: object
  dto.CommentResponse:
    properties:
      author_avatar_url:
        type: string
      author_id:
        type: integer
      author_name:
        type: string
      body:
        type: string
      created_at:
        type: string
      id:
        type: integer
      issue_id:
        type: integer
      updated_at:
        type: string
    type: object
  dto.CompleteSprintRequest:
    properties:
      next_sprint_id:
        type: integer
    type: object
  dto.CreateCommentRequest:
    properties:
      body:
        type: string
    required:
    - body
    type: object
  dto.CreateIssueRequest:
    properties:
      assignee_id:
        type: integer
      description:
        type: string
      priority:
        enum:
        - low
        - medium
        - high
        - critical
        type: string
      story_points:
        type: integer
      title:
        type: string
      type:
        enum:
        - task
        - story
        - bug
        - epic
        type: string
    required:
    - priority
    - title
    - type
    type: object
  dto.CreateLabelRequest:
    properties:
      color:
        type: string
      name:
        type: string
    required:
    - color
    - name
    type: object
  dto.CreateProjectRequest:
    properties:
      description:
        type: string
      key:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  dto.CreateRelationRequest:
    properties:
      relation_type:
        type: string
      target_issue_id:
        type: integer
    type: object
  dto.CreateSprintRequest:
    properties:
      end_date:
        type: string
      goal:
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      start_date:
        type: string
    required:
    - name
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.ForgotPasswordResponse:
    properties:
      expires_at:
        type: string
      message:
        type: string
      token:
        type: string
    type: object
  dto.IssueResponse:
    properties:
      assignee_avatar_url:
        type: string
      assignee_id:
        type: integer
      assignee_name:
        type: string
      attachment_count:
        type: integer
      completed_at:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      key:
        type: string
      priority:
        type: string
      project_id:
        type: integer
      reporter_id:
        type: integer
      sprint_id:
        type: integer
      status:
        type: string
      story_points:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  dto.LabelResponse:
    properties:
      color:
        type: string
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      project_id:
        type: integer
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.MemberResponse:
    properties:
      email:
        type: string
      name:
        type: string
      role:
        type: string
      user_id:
        type: integer
    type: object
  dto.NotificationResponse:
    properties:
      actor_id:
        type: integer
      actor_name:
        type: string
      comment_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      issue_id:
        type: integer
      issue_key:
        type: string
      kind:
        type: string
      project_key:
        type: string
      project_name:
        type: string
      read:
        type: boolean
      recipient_id:
        type: integer
    type: object
  dto.PatchSettingsRequest:
    properties:
      date_format:
        type: string
      demo_banner_enabled:
        type: string
      demo_banner_message:
        type: string
      locale:
        type: string
      organization_name:
        type: string
      system_log_retention_days:
        type: string
      time_format:
        type: string
      week_start_day:
        type: string
    type: object
  dto.ProjectResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      key:
        type: string
      name:
        type: string
      owner_id:
        type: integer
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  dto.RelatedIssueInfo:
    properties:
      id:
        type: integer
      key:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  dto.RelationResponse:
    properties:
      id:
        type: integer
      related_issue:
        $ref: '#/definitions/dto.RelatedIssueInfo'
      relation_type:
        type: string
    type: object
  dto.ResetPasswordRequest:
    properties:
      password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - password
    - token
    type: object
  dto.SettingsResponse:
    properties:
      date_format:
        type: string
      demo_banner_enabled:
        description: |-
          DemoBannerEnabled is "true"/"false" as a string, same reason as above
          (013-demo-instance-banner, FR-001).
        type: string
      demo_banner_message:
        type: string
      locale:
        type: string
      organization_name:
        type: string
      system_log_retention_days:
        description: |-
          SystemLogRetentionDays is a string (not an int) for the same reason
          every other setting value is a string: global_settings is a generic
          key-value store (011-system-logs, FR-010).
        type: string
      time_format:
        type: string
      week_start_day:
        type: string
    type: object
  dto.SetupAdminRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  dto.SetupProjectRequest:
    properties:
      add_user_id:
        description: |-
          AddUserID is non-zero when the team member created in step 2
          should be added to this project as a "member".
        type: integer
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  dto.SetupProjectResponse:
    properties:
      name:
        type: string
      project_id:
        type: integer
      project_key:
        type: string
    type: object
  dto.SetupSeedResponse:
    properties:
      project_key:
        type: string
      project_name:
        type: string
      skipped:
        type: boolean
    type: object
  dto.SetupStatusResponse:
    properties:
      demo_banner_enabled:
        description: |-
          DemoBannerEnabled/DemoBannerMessage let unauthenticated pages (e.g.
          /login) show the demo-instance banner without needing the JWT-gated
          GET /settings (013-demo-instance-banner, research.md Decision 1).
        type: boolean
      demo_banner_message:
        type: string
      setup_required:
        type: boolean
    type: object
  dto.SetupUserRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  dto.SetupUserResponse:
    properties:
      email:
        type: string
      name:
        type: string
      user_id:
        type: integer
    type: object
  dto.SprintResponse:
    properties:
      created_at:
        type: string
      end_date:
        type: string
      goal:
        type: string
      id:
        type: integer
      issue_count:
        type: integer
      name:
        type: string
      project_id:
        type: integer
      start_date:
        type: string
      status:
        type: string
      total_story_points:
        type: integer
      updated_at:
        type: string
    type: object
  dto.SystemLogEntryDTO:
    properties:
      action:
        type: string
      actor_label:
        type: string
      created_at:
        type: string
      detail:
        type: string
      event_category:
        type: string
      id:
        type: string
      outcome:
        type: string
      target_label:
        type: string
    type: object
  dto.SystemLogListResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/dto.SystemLogEntryDTO'
        type: array
      page:
        type: integer
      size:
        type: integer
      total:
        type: integer
    type: object
  dto.UpdateCommentRequest:
    properties:
      body:
        type: string
    required:
    - body
    type: object
  dto.UpdateIssueRequest:
    properties:
      assignee_id:
        description: AssigneeID assigns the issue to a user. Send 0 to unassign; omit
          to leave unchanged.
        type: integer
      description:
        type: string
      priority:
        enum:
        - low
        - medium
        - high
        - critical
        type: string
      sprint_id:
        description: SprintID assigns the issue to a sprint. Send 0 to move the issue
          back to the backlog.
        type: integer
      status:
        enum:
        - backlog
        - todo
        - in_progress
        - in_review
        - done
        type: string
      story_points:
        type: integer
      title:
        type: string
      type:
        enum:
        - task
        - story
        - bug
        - epic
        type: string
    type: object
  dto.UpdateProfileRequest:
    properties:
      avatar_url:
        type: string
      full_name:
        type: string
      timezone:
        type: string
    type: object
  dto.UpdateProjectRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  dto.UpdateSprintRequest:
    properties:
      end_date:
        type: string
      goal:
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      start_date:
        type: string
    type: object
  dto.UserDTO:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  dto.UserProfileResponse:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      is_admin:
        type: boolean
      name:
        type: string
      timezone:
        type: string
    type: object
  dto.VelocityDataPoint:
    properties:
      committed:
        description: total story points across all sprint issues
        type: number
      completed:
        description: story points of Done issues
        type: number
      sprint_id:
        type: integer
      sprint_name:
        type: string
    type: object
  handler.healthResponse:
    properties:
      db:
        type: string
      db_latency_ms:
        type: integer
      error:
        type: string
      loki:
        type: string
      status:
        type: string
    type: object
info:
  contact: {}
  description: Mini Jira clone REST API
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
  title: jira-go API
  version: "1.0"
paths:
  /about:
    get:
      description: Public — no auth required. Lets any user of a running instance,
        including on the sign-in page, find the source they are entitled to under
        AGPL-3.0 section 13.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AboutResponse'
      summary: This instance's version, source location and licence
      tags:
      - about
  /admin/system-logs:
    get:
      parameters:
      - description: authentication|admin_action|settings_change|db_lifecycle
        in: query
        name: category
        type: string
      - description: RFC3339 lower bound
        in: query
        name: from
        type: string
      - description: RFC3339 upper bound
        in: query
        name: to
        type: string
      - description: Actor filter
        in: query
        name: actor
        type: string
      - description: Free-text search
        in: query
        name: q
        type: string
      - default: 1
        description: Page (1-based)
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size (max 100)
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SystemLogListResponse'
        "400":
          description: Invalid query params
          schema:
            $ref: '#/definitions/apierror.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: List system log entries (Admin only)
      tags:
      - admin
  /admin/users:
    get:
      parameters:
      - default: 1
        description: Page (1-based)
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size (max 100)
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AdminUserListResponse'
        "400":
          description: Invalid query params
          schema:
            $ref: '#/definitions/apierror.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: List all users (admin only)
      tags:
      - admin
  /admin/users/{id}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.AdminUserPatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AdminUserDTO'
        "400":
          description: Invalid body or params
          schema:
            $ref: '#/definitions/apierror.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierror.APIError'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/apierror.APIError'
        "409":
          description: Cannot remove last admin
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: Update user role or status (admin only)
      tags:
      - admin
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ForgotPasswordResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/apierror.APIError'
      summary: Request a password reset token
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/apierror.APIError'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/apierror.APIError'
      summary: Authenticate a user
      tags:
      - auth
  /auth/logout:
    post:
      description: Reads the refresh_token cookie. Missing or invalid tokens are ignored
        — logout is always idempotent (200). Rate-limited per ADR-021.
      responses:
        "200":
          description: Cookie cleared
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/apierror.APIError'
      summary: Revoke the refresh token and clear its cookie
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - users
    put:
      consumes:
      - application/json
      parameters:
      - description: Profile update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - users
  /auth/me/activity:
    get:
      parameters:
      - description: Max results (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ActivityEventResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: Get activity feed for current user
      tags:
      - users
  /auth/me/avatar:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: Delete current user's avatar
      tags:
      - users
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Avatar image (JPEG/PNG/WebP, max 2 MB)
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.APIError'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/apierror.APIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: Upload current user's avatar
      tags:
      - users
  /auth/me/issues:
    get:
      parameters:
      - description: Filter by status (todo, in_progress, in_review, done, backlog)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.IssueResponse'
            type: array
        "401":
          description: Unauthorized
